[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "myoralia-cli"
dynamic = ["version"]
description = "Read your MyOralia coproprietaire account from the terminal"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.15.0",
    "click==8.5.0",
    "curl-cffi==0.16.3",
    "browser-cookie3==0.20.1",
    "websocket-client==1.9.2",
]

[project.scripts]
myoralia = "myoralia.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.7", "build==1.6.1"]

[tool.uv]
exclude-newer = "2026-10-27T00:00:00Z"

[tool.hatch.version]
path = "src/myoralia/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/myoralia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: reads the real account using an explicitly enabled local session"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
